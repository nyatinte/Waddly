[settings]
lockfile = true
lockfile_platforms = ["macos-arm64"]

[tools]
hk = "2.4.0"
"aqua:orhun/git-cliff" = "2.14.2"
"aqua:realm/SwiftLint" = "0.65.1"
"github:nicklockwood/SwiftFormat" = { version = "0.63.1", no_app = true }
"github:moznion/cccc" = "1.8.0"

[tasks.format]
description = "Format Swift sources"
run = "mise exec github:nicklockwood/SwiftFormat -- swiftformat Sources Tests Package.swift Tools"

[tasks."format:check"]
description = "Check Swift formatting"
run = "mise exec github:nicklockwood/SwiftFormat -- swiftformat Sources Tests Package.swift Tools --lint"

[tasks.lint]
description = "Check localizations and run strict SwiftLint"
run = [
  "swift Tools/generate_localizations.swift --check",
  "TOOLCHAIN_DIR=\"$(xcode-select -p)\" mise exec aqua:realm/SwiftLint -- swiftlint lint --strict Sources Tests macos Package.swift Tools",
]

[tasks.complexity]
description = "Enforce per-function cognitive and cyclomatic complexity limits"
run = "cccc --lang swift --max-cognitive 15 --max-cyclomatic 10 --top-cognitive 10 Sources Tests"

[tasks.test]
description = "Run Swift Testing suites serially"
run = "./macos/test.sh --no-parallel"

[tasks.build]
description = "Build the signed Release app"
run = "./macos/build.sh"

[tasks.package]
description = "Build and package the app as a DMG"
run = "./macos/package.sh"

[tasks."dev:install"]
description = "Build and install the development app (own bundle id, own data)"
run = "./macos/build-development.sh"

[tasks."dev:reset"]
description = "Clear the development app's images and preferences"
run = "./macos/reset-development.sh"

[tasks.check]
description = "Run all local validation and build the Release app"
run = ["mise run format:check", "mise run lint", "mise run complexity", "mise run safety", "mise run safety:test", "mise run test", "mise run build"]

[tasks.safety]
description = "Run AST-aware Swift safety checks"
run = "swift run --package-path Tools/SwiftSafetyCheck swift-safety-check --check Sources Tests"

[tasks."safety:test"]
description = "Prove Swift safety rules reject dangerous fixtures"
run = "bash Tools/test_swift_safety.sh"

[tasks."memory:test"]
description = "Run isolated Release memory regression tests (macOS 26+, Swift 6.2+)"
run = "./macos/test.sh --package-path Performance -c release"
