name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and self-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Mint and SwiftLint
        run: |
          brew install mint swiftlint
          mint bootstrap

      - name: Show toolchain versions
        run: |
          swift --version
          mint run swiftformat --version
          swiftlint version

      - name: Build Release app with strict lint
        run: ./macos/build.sh

      - name: Run Swift Testing suites
        run: swift test