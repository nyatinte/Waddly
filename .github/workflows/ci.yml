name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and self-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install locked development tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.11

      - name: Show toolchain versions
        run: |
          swift --version
          swiftformat --version
          swiftlint version
          hk --version

      - name: Run the same checks as the commit hook
        run: hk check --all

      - name: Build Release app with strict lint
        run: ./macos/build.sh

      - name: Run Swift Testing suites
        run: ./macos/test.sh
