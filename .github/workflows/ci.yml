name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and self-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Mint and SwiftLint
        run: |
          brew install mint swiftlint
          mint bootstrap

      # Homebrew ships hk 1.58.1, which does not read the hk.pkl used here, so CI
      # installs the version pinned in mise.toml from its release asset.
      - name: Install the pinned hk version
        env:
          HK_VERSION: 2.4.0
          HK_SHA256: 6e1c970b9de7ab4ee52c85869b2ea9cfe8769d25a0fe9536062e0ba62366ec59
        run: |
          curl -fsSL -o /tmp/hk.tar.gz \
            "https://github.com/jdx/hk/releases/download/v${HK_VERSION}/hk-aarch64-apple-darwin.tar.gz"
          echo "${HK_SHA256}  /tmp/hk.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf /tmp/hk.tar.gz -C /usr/local/bin hk

      - name: Show toolchain versions
        run: |
          swift --version
          mint run swiftformat --version
          swiftlint version
          hk --version

      - name: Run the same checks as the commit hook
        run: hk check --all

      - name: Build Release app with strict lint
        run: ./macos/build.sh

      - name: Run Swift Testing suites
        run: swift test