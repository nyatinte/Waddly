name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint, and self-test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Install locked development tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.11

      - name: Show toolchain versions
        run: |
          swift --version
          swiftformat --version
          swiftlint version
          hk --version

      - name: Identify Swift toolchain
        id: swift-toolchain
        run: echo "key=$({ swift --version; xcodebuild -version; echo "$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Swift safety checker build
        uses: actions/cache@v4.3.0
        with:
          path: Tools/SwiftSafetyCheck/.build
          key: swift-safety-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift-toolchain.outputs.key }}-${{ hashFiles('Tools/SwiftSafetyCheck/Package.swift', 'Tools/SwiftSafetyCheck/Package.resolved', 'Tools/SwiftSafetyCheck/Sources/**/*.swift') }}

      - name: Run full local validation
        run: mise run check

      - name: Validate release-note ranges and rendering
        run: mise exec -- bash Tools/test_release_notes_range.sh

      - name: Verify GitHub Actions dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify

  memory:
    name: Release image memory budget
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Install locked development tools
        uses: jdx/mise-action@v4.3.0
        with:
          version: 2026.9.11

      - name: Check performance source style
        run: |
          mise exec github:nicklockwood/SwiftFormat -- swiftformat Performance/Package.swift Performance/Tests --lint
          TOOLCHAIN_DIR="$(xcode-select -p)" mise exec aqua:realm/SwiftLint -- swiftlint lint --strict Performance/Package.swift Performance/Tests

      - name: Run serialized memory regression suite
        run: mise run memory:test
