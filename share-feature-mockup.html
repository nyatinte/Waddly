<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waddly — 共有機能の実装イメージ</title>
<style>
  :root { color-scheme: light; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #222; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #e9edf2; }
  .window { width: min(1100px, 100%); overflow: hidden; border: 1px solid #c9cdd3; border-radius: 14px; background: #f5f5f7; box-shadow: 0 24px 80px #29374730; }
  .titlebar { height: 48px; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid #d9d9dc; background:#fafafa; font-weight:600; }
  .traffic { position:absolute; left:16px; display:flex; gap:8px; }
  .traffic i { width:12px; height:12px; border-radius:50%; background:#ff6058; } .traffic i:nth-child(2){background:#ffbd2e}.traffic i:nth-child(3){background:#28c840}
  .desktop { position:relative; height:600px; overflow:hidden; background:radial-gradient(ellipse at 27% 28%,#aec7d6 0,#8daebe 28%,transparent 55%),linear-gradient(135deg,#758e9d,#465c6e 72%,#364959); }
  .desktop:after { content:""; position:absolute; inset:auto 0 0;height:100px;background:linear-gradient(transparent,#18273455);pointer-events:none; }
  .desktop-label { position:absolute; left:26px; top:22px; color:#ffffffc9; font-size:13px; letter-spacing:.02em; }
  .pet { position:absolute; left:25%; top:31%; width:170px;height:170px; display:grid;place-items:center; border-radius:50%;background:#ffffff17;box-shadow:0 16px 55px #12223040; }
  .sprite { width:112px;height:112px; image-rendering:pixelated; background:url('assets/examples/nyatinte-bot-3x3.png') 0 0 / 300% 300% no-repeat; filter:drop-shadow(0 6px 2px #18263355); }
  .hint { position:absolute; left:calc(25% + 8px); top:calc(31% + 178px); color:#f7fbff; font-size:12px; text-shadow:0 1px 3px #0008; }
  .menu { position:absolute; left:calc(25% + 100px); top:calc(31% + 95px); z-index:2; width:224px; padding:6px; border:1px solid #ffffff80;border-radius:11px;background:#f8f8f8ed;box-shadow:0 12px 36px #17233155;backdrop-filter:blur(18px); }
  .mi { min-height:31px; padding:6px 9px; border-radius:6px; display:flex;justify-content:space-between;align-items:center; color:#232323; }
  .mi.active { background:#3478f6;color:white; }
  .mi .arrow { opacity:.7; }
  .sep {height:1px;background:#d5d5d5;margin:4px 5px;}
  .popover { position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%); width:min(700px,calc(100% - 48px)); border:1px solid #ffffffa8;border-radius:16px;background:#f8f8f9f5;box-shadow:0 20px 65px #17233170;backdrop-filter:blur(24px);padding:22px; }
  .pop-head { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:17px; }
  h1 {font-size:18px;line-height:1.2;margin:0 0 4px;font-weight:650}.sub{font-size:12px;color:#707078;margin:0}
  .close {border:0;border-radius:50%;width:25px;height:25px;background:#e5e5e8;color:#666;font-size:16px;cursor:pointer;line-height:1;}
  .previews {display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .preview-card {position:relative;min-width:0;padding:10px;border:1px solid #d9d9de;border-radius:12px;background:#fff;}
  .preview-head {display:flex;justify-content:space-between;align-items:center;margin:1px 1px 9px;font-size:12px;font-weight:600;}
  .copy {border:0;border-radius:6px;background:#edf0f4;color:#343941;padding:5px 9px;font-size:11px;cursor:pointer;}
  .copy:hover {background:#dfe8f9}
  .preview-area {position:relative;height:180px;border-radius:8px;display:grid;place-items:center;overflow:hidden;background-color:#e9edf0;background-image:linear-gradient(45deg,#dce1e5 25%,transparent 25%),linear-gradient(-45deg,#dce1e5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dce1e5 75%),linear-gradient(-45deg,transparent 75%,#dce1e5 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;}
  .movie-pet {width:106px;height:106px;background:url('assets/examples/nyatinte-bot-3x3.png') 0 0 / 300% 300% no-repeat;image-rendering:pixelated;filter:drop-shadow(0 6px 5px #26354435);}
  .play {position:absolute;width:48px;height:48px;display:grid;place-items:center;padding-left:3px;border:1px solid #ffffffb5;border-radius:50%;background:#20252dcc;color:white;font-size:19px;cursor:pointer;box-shadow:0 3px 12px #0004;}
  .play.playing {padding-left:0;font-size:15px;}
  .sheet {width:162px;height:162px;object-fit:contain;image-rendering:pixelated;}
  .preview-foot {margin:8px 2px 0;font-size:10px;color:#76767e;}
  .section { margin:17px 0 7px;font-size:11px;font-weight:650;color:#73737b;letter-spacing:.03em; }
  .xrow {display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:#eeeeF1;}
  .xlogo {width:32px;height:32px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;}
  .xtext{flex:1}.xtext b{font-size:12px}.xtext small{display:block;color:#717179;font-size:11px;margin-top:2px}
  .xbutton {border:0;border-radius:7px;background:#171717;color:white;font-weight:600;padding:7px 10px;cursor:pointer;font-size:11px;}
  .toast { position:absolute;z-index:5;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#202126eF;color:#fff;border-radius:10px;box-shadow:0 5px 20px #0003;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap; }
  .toast.show{opacity:1}
  .foot { padding:12px 18px;display:flex;justify-content:space-between;color:#777;font-size:11px;background:#f9f9fa;border-top:1px solid #ddd; }
  @media(max-width:800px){body{padding:0}.window{border-radius:0}.desktop{height:760px}.popover{top:52%;width:calc(100% - 28px);padding:16px}.preview-area{height:145px}.sheet{width:130px;height:130px}.menu{left:20px;top:110px}.pet{left:calc(50% - 85px);top:25px}.hint{left:calc(50% - 82px);top:205px}}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><span class="traffic"><i></i><i></i><i></i></span>Waddly — 共有のイメージ</div>
  <main class="desktop">
    <div class="desktop-label">右クリックメニューの「ペットをシェア」を選択</div>
    <div class="pet"><div class="sprite"></div></div>
    <div class="hint">共有ダイアログが開いた時点で素材を作成</div>
    <section class="popover">
      <div class="pop-head"><div><h1>ペットをシェア</h1><p class="sub">作成済みの動画とスプライトシートをコピーできます</p></div><button class="close" aria-label="閉じる">×</button></div>
      <div class="previews">
        <article class="preview-card">
          <div class="preview-head"><span>5秒の動画</span><button class="copy" data-message="動画をクリップボードにコピーしました">▢ コピー</button></div>
          <div class="preview-area"><div class="movie-pet" id="movie"></div><button class="play" aria-label="動画を再生">▶</button></div>
          <div class="preview-foot">MP4 · プレビューと同じ動き</div>
        </article>
        <article class="preview-card">
          <div class="preview-head"><span>3×3スプライトシート</span><button class="copy" data-message="シートをクリップボードにコピーしました">▢ コピー</button></div>
          <div class="preview-area"><img class="sheet" src="assets/examples/nyatinte-bot-3x3.png" alt="3×3スプライトシート"></div>
          <div class="preview-foot">透過PNG · 9コマ</div>
        </article>
      </div>
      <div class="section">投稿する</div>
      <div class="xrow"><span class="xlogo">𝕏</span><span class="xtext"><b>Xで投稿を作成</b></span><button class="xbutton" id="xbutton">Xを開く</button></div>
    </section>
    <div class="toast" role="status"></div>
  </main>
  <div class="foot"><span>操作イメージ — 実際の書き出し・投稿はまだ行いません</span><span>クリックして表示を確認できます</span></div>
</div>
<script>
const toast = document.querySelector('.toast');
let timer;
function notify(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 2200); }
document.querySelectorAll('.copy').forEach(button => button.addEventListener('click', () => notify(button.dataset.message)));
const play = document.querySelector('.play');
let playing = false;
play.addEventListener('click', () => {
  playing = !playing;
  play.textContent = playing ? 'Ⅱ' : '▶';
  play.classList.toggle('playing', playing);
  document.querySelector('#movie').style.backgroundPosition = playing ? '100% 0' : '0 0';
  notify(playing ? '動画プレビュー再生中（モック）' : 'プレビューを一時停止しました');
});
document.querySelector('.close').addEventListener('click', () => notify('閉じる操作のイメージです'));
document.querySelector('#xbutton').addEventListener('click', () => notify('Xの投稿画面を開くイメージです'));
</script>
</body>
</html>
